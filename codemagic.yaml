workflows:
  android-build:
    name: 人生五册 APK 构建
    max_build_height: 72
    environment:
      vars:
        FLUTTER_VERSION: "3.24.0"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: 安装 Flutter
        script: |
          flutter channel stable
          flutter upgrade
      - name: 获取依赖
        script: flutter pub get
      - name: 构建 APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - wus72089@users.noreply.github.com
